name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import + entry-point smoke test
        run: |
          python -c "import audio_eval_suite; from audio_eval_suite.run_eval import main; print('import OK')"
          audio-eval-suite --help

      - name: Validate task YAML
        run: |
          pip install pyyaml
          python -c "import yaml,sys; d=yaml.safe_load(open('tasks/audio_eval_suite.yaml')); print('task YAML OK:', list(d) if isinstance(d,dict) else type(d))"

      - name: Validate quickstart notebook
        run: |
          pip install nbformat
          python -c "import nbformat; nb=nbformat.read('notebooks/quickstart.ipynb', as_version=4); nbformat.validate(nb); print('notebook OK:', len(nb.cells), 'cells')"
