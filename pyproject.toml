[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-eval-suite"
version = "0.1.0"
description = "A fast, dependency-light evaluation suite for reverberation-robustness and blind RT60 estimation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mandip Goswami", email = "mandipgoswami@gmail.com" }]
keywords = ["audio", "acoustics", "reverberation", "rt60", "dereverberation", "evaluation", "benchmark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "datasets>=2.14",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/mandip42/audio_eval_suite"
Dataset = "https://huggingface.co/datasets/mandipgoswami/audio-eval-suite"

[project.scripts]
audio-eval-suite = "audio_eval_suite.run_eval:main"

[tool.setuptools.packages.find]
where = ["src"]
